name: Build VidioAI Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de la release (ex: 2026.08.10-3)"
        required: true
        type: string

jobs:
  release:
    name: Build and publish VidioAI release

    runs-on:
      - self-hosted
      - Linux
      - X64
      - vidioai-build

    permissions:
      contents: read

    steps:
      # --------------------------------------------------------
      # 1. Récupérer VidioAI
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Rust
      # --------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy


      # --------------------------------------------------------
      # 3. Node.js / Next.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # --------------------------------------------------------
      # 4. Python worker
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-test.txt


      # --------------------------------------------------------
      # 5. AWS CLI
      # --------------------------------------------------------
      - name: Install AWS CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install awscli

          aws --version


      # --------------------------------------------------------
      # 6. Vérifier le serveur de build
      # --------------------------------------------------------
      - name: Check build server
        shell: bash
        run: |
          echo "=== CPU ==="
          nproc

          echo "=== RAM ==="
          free -h

          echo "=== DISK ==="
          df -h

          echo "=== DOCKER ==="
          docker --version
          docker compose version
          docker buildx version

          echo "=== SYSTEM DEPENDENCIES ==="
          protoc --version
          pkg-config --version
          jq --version
          cmake --version

          echo "=== DOCKER DISK USAGE ==="
          docker system df


      # --------------------------------------------------------
      # 7. Docker Buildx
      # --------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # 8. Connexion Scaleway Container Registry
      # --------------------------------------------------------
      - name: Login to Scaleway Container Registry
        shell: bash
        env:
          REGISTRY: ${{ vars.VIDIOAI_REGISTRY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_CI_SECRET_KEY }}

        run: |
          printf '%s' "${SCW_SECRET_KEY}" \
            | docker login "${REGISTRY}" \
                --username nologin \
                --password-stdin


      # --------------------------------------------------------
      # 9. Vérifier build-release.sh
      # --------------------------------------------------------
      - name: Check release script
        shell: bash
        run: |
          test -f deploy/scripts/build-release.sh

          chmod +x deploy/scripts/build-release.sh

          bash -n deploy/scripts/build-release.sh


      # --------------------------------------------------------
      # 10. Construction + publication
      # --------------------------------------------------------
      - name: Build and publish VidioAI release
        shell: bash

        env:
          VIDIOAI_REGISTRY: ${{ vars.VIDIOAI_REGISTRY }}

          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_CI_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_CI_SECRET_KEY }}

          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}

          AWS_S3_STORAGE_CLASS: STANDARD

        run: |
          ./deploy/scripts/build-release.sh "${{ inputs.version }}"


      # --------------------------------------------------------
      # 11. Vérifier le bundle
      # --------------------------------------------------------
      - name: Check generated release
        shell: bash

        run: |
          RELEASE="output/vidioai-release-${{ inputs.version }}.tar.gz"

          test -f "${RELEASE}"

          echo "Release generated:"
          ls -lh "${RELEASE}"


      # --------------------------------------------------------
      # 12. Garder également le bundle sur GitHub
      # --------------------------------------------------------
      - name: Upload release artifact
        uses: actions/upload-artifact@v4

        with:
          name: vidioai-release-${{ inputs.version }}
          path: output/vidioai-release-${{ inputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 30