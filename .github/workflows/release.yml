name: Build VidioAI Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de la release (ex: 2026.08.10-1)"
        required: true
        type: string

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      # --------------------------------------------------------
      # 1. Récupération du projet
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Rust
      # --------------------------------------------------------
      - name: Install Rust 1.96
        shell: bash
        run: |
          rustup toolchain install 1.96.0
          rustup default 1.96.0
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      # --------------------------------------------------------
      # 3. Node.js pour Next.js
      # --------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --------------------------------------------------------
      # 4. Python pour le worker
      # --------------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-test.txt

      # --------------------------------------------------------
      # 5. Outils nécessaires au build-release.sh
      # --------------------------------------------------------
      - name: Install system tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python -m pip install --upgrade pip
          python -m pip install awscli

          jq --version
          aws --version

      # --------------------------------------------------------
      # 6. Docker Buildx
      # --------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker
        shell: bash
        run: |
          docker --version
          docker buildx version

      # --------------------------------------------------------
      # 7. Connexion au Container Registry Scaleway
      # --------------------------------------------------------
      - name: Login to Scaleway Container Registry
        shell: bash
        env:
          REGISTRY: ${{ vars.VIDIOAI_REGISTRY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_CI_SECRET_KEY }}
        run: |
          printf '%s' "${SCW_SECRET_KEY}" \
            | docker login "${REGISTRY}" \
                --username nologin \
                --password-stdin

      # --------------------------------------------------------
      # 8. Vérification du script
      # --------------------------------------------------------
      - name: Check release script
        shell: bash
        run: |
          test -f deploy/scripts/build-release.sh
          chmod +x deploy/scripts/build-release.sh
          bash -n deploy/scripts/build-release.sh

      # --------------------------------------------------------
      # 9. Build complet + publication
      # --------------------------------------------------------
      - name: Build and publish VidioAI release
        shell: bash
        env:
          VIDIOAI_REGISTRY: ${{ vars.VIDIOAI_REGISTRY }}

          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_CI_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_CI_SECRET_KEY }}

          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}

          AWS_S3_STORAGE_CLASS: STANDARD
        run: |
          ./deploy/scripts/build-release.sh "${{ inputs.version }}"

      # --------------------------------------------------------
      # 10. Vérifier que le bundle existe
      # --------------------------------------------------------
      - name: Check generated release
        shell: bash
        run: |
          RELEASE="output/vidioai-release-${{ inputs.version }}.tar.gz"

          test -f "${RELEASE}"

          echo "Release generated:"
          ls -lh "${RELEASE}"

      # --------------------------------------------------------
      # 11. Conserver également le bundle dans GitHub
      # --------------------------------------------------------
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidioai-release-${{ inputs.version }}
          path: output/vidioai-release-${{ inputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 30