name: vidioai

services:

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      APP_ENV: LOCAL
      VIDIOAI_STATE_DIR: /data/state
      VIDIOAI_MODELS_DIR: /data/models
      VIDIOAI_OUTPUTS_DIR: /data/outputs
      VIDIOAI_CACHE_DIR: /data/cache
      VIDIOAI_WORK_DIR: /data/work
      VIDIOAI_WORKER_URL: ${VIDIOAI_WORKER_URL:-}
      HOST_AGENT_URL: ${HOST_AGENT_URL:-http://host.docker.internal:8091}
      HOST_AGENT_TOKEN: ${HOST_AGENT_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_CATALOG_TTL_SECONDS: ${HF_CATALOG_TTL_SECONDS:-900}
      RUST_LOG: ${RUST_LOG:-info}

    volumes:
      - vidioai-data:/data

    expose:
      - "8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/api/ready
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

    stop_grace_period: 45s


  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""

    restart: unless-stopped

    environment:
      VIDIOAI_BACKEND_URL: http://backend:8080

    expose:
      - "3000"

    depends_on:
      backend:
        condition: service_healthy


  worker:
    build:
      context: ./worker

    profiles:
      - gpu

    restart: unless-stopped

    environment:
      APP_ENV: LOCAL
      GPU_REQUIRED: "false"
      HF_HOME: /data/cache/huggingface
      HF_HUB_CACHE: /data/cache/huggingface/hub
      HUGGINGFACE_HUB_CACHE: /data/cache/huggingface/hub
      TRANSFORMERS_CACHE: /data/cache/huggingface/transformers
      DIFFUSERS_CACHE: /data/cache/huggingface/diffusers
      TORCH_HOME: /data/cache/torch
      XDG_CACHE_HOME: /data/cache/xdg
      TMPDIR: /data/worker-work
      VIDIOAI_MODELS_DIR: /models
      VIDIOAI_WORK_DIR: /data/worker-work
      VIDIOAI_OUTPUTS_DIR: /data/work

    volumes:
      - vidioai-models:/models
      - vidioai-data:/data

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu


  proxy:
    image: nginx:1.27-alpine

    restart: unless-stopped

    ports:
      - "${VIDIOAI_HTTP_PORT:-80}:80"

    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend


volumes:
  vidioai-data:
  vidioai-models:
