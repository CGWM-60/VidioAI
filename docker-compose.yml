name: vidioai

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VIDIOAI_VERSION: ${VIDIOAI_VERSION:-dev}

    restart: unless-stopped

    environment:
      APP_ENV: LOCAL
      VIDIOAI_VERSION: ${VIDIOAI_VERSION:-dev}
      VIDIOAI_STATE_DIR: /data/state
      VIDIOAI_MODELS_DIR: /models
      VIDIOAI_OUTPUTS_DIR: /data/outputs
      VIDIOAI_CACHE_DIR: /data/cache
      VIDIOAI_WORK_DIR: /data/work
      VIDIOAI_MODEL_PACKS_DIR: /opt/vidioai/model-packs
      VIDIOAI_WORKFLOWS_DIR: /opt/vidioai/workflows
      VIDIOAI_MODEL_PACK_REGISTRY_DIR: /registry
      VIDIOAI_WORKER_URL: ${VIDIOAI_WORKER_URL:-}
      HOST_AGENT_URL: ${HOST_AGENT_URL:-}
      HOST_AGENT_TOKEN: ${HOST_AGENT_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_CATALOG_TTL_SECONDS: ${HF_CATALOG_TTL_SECONDS:-900}
      VIDIOAI_S3_ENABLED: "false"
      RUST_LOG: ${RUST_LOG:-info}

    volumes:
      - vidioai-data:/data
      - vidioai-models:/models
      - vidioai-pack-registry:/registry

    labels:
      org.opencontainers.image.version: ${VIDIOAI_VERSION:-dev}

    expose:
      - "8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/api/health
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

    stop_grace_period: 45s


  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        VIDIOAI_VERSION: ${VIDIOAI_VERSION:-dev}
        NEXT_PUBLIC_VIDIOAI_VERSION: ${VIDIOAI_VERSION:-dev}

    restart: unless-stopped

    environment:
      VIDIOAI_BACKEND_URL: http://backend:8080
      VIDIOAI_VERSION: ${VIDIOAI_VERSION:-dev}
      NEXT_PUBLIC_VIDIOAI_VERSION: ${VIDIOAI_VERSION:-dev}

    labels:
      org.opencontainers.image.version: ${VIDIOAI_VERSION:-dev}

    expose:
      - "3000"

    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:3000/
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

    depends_on:
      backend:
        condition: service_healthy


  worker:
    # Un tag explicite permet à la CI de retrouver l'image construite sans
    # dépendre de l'existence préalable d'un conteneur Compose.
    image: ${VIDIOAI_WORKER_IMAGE:-vidioai-worker:local}

    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        VIDIOAI_VERSION: ${VIDIOAI_VERSION:-dev}

    profiles:
      - gpu

    restart: unless-stopped

    environment:
      APP_ENV: LOCAL
      VIDIOAI_VERSION: ${VIDIOAI_VERSION:-dev}
      GPU_REQUIRED: "false"
      HF_HOME: /data/cache/huggingface
      HF_HUB_CACHE: /data/cache/huggingface/hub
      HUGGINGFACE_HUB_CACHE: /data/cache/huggingface/hub
      HF_XET_CACHE: /data/cache/huggingface/xet
      HF_ASSETS_CACHE: /data/cache/huggingface/assets
      TRANSFORMERS_CACHE: /data/cache/huggingface/transformers
      DIFFUSERS_CACHE: /data/cache/huggingface/diffusers
      TORCH_HOME: /data/cache/torch
      XDG_CACHE_HOME: /data/cache/xdg
      TMPDIR: /data/worker-work
      VIDIOAI_MODELS_DIR: /models
      VIDIOAI_RUNTIME_DEPS_DIR: /data/cache/runtime-deps
      VIDIOAI_WORK_DIR: /data/worker-work
      VIDIOAI_OUTPUTS_DIR: /data/work
      VIDIOAI_MODEL_PACKS_DIR: /opt/vidioai/model-packs
      VIDIOAI_WORKFLOWS_DIR: /opt/vidioai/workflows
      VIDIOAI_MODEL_PACK_REGISTRY_DIR: /registry
      COMFYUI_URL: ${COMFYUI_URL:-http://comfyui:8188}
      VIDIOAI_COMFYUI_URL: ${COMFYUI_URL:-http://comfyui:8188}

    volumes:
      - vidioai-models:/models
      - vidioai-data:/data
      - vidioai-pack-registry:/registry:ro

    labels:
      org.opencontainers.image.version: ${VIDIOAI_VERSION:-dev}

    # Le backend initialise le volume de registre avec l'UID d'écriture. Le
    # worker ne fait ensuite que lire les snapshots actifs.
    depends_on:
      backend:
        condition: service_started

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu


  proxy:
    image: nginx:1.27.5-alpine

    restart: unless-stopped

    ports:
      - "${VIDIOAI_HTTP_PORT:-80}:80"

    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://127.0.0.1/api/health && wget --spider --quiet http://127.0.0.1/
      interval: 15s
      timeout: 5s
      retries: 8

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy


volumes:
  vidioai-data:
  vidioai-models:
  vidioai-pack-registry:
